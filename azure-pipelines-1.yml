trigger:
  branches:
    include:
      - main
      - dev
      - azure-boards

pool:
  vmImage: "ubuntu-latest"

variables:
  checkmarxServiceConnection: "juiceshop-connection"
  checkmarxTenant: "nfr_lugapel-ast"
  mavenSettingsFile: "$(Build.SourcesDirectory)/settings.xml"
  mavenGoals: "test"
  enableMavenCache: "true"

  # Umbrales de calidad — compartidos por ambas fases
  thresholdCritical: "0"
  thresholdHigh: "5"
  thresholdMedium: "10"

# ─────────────────────────────────────────────────────────────
# STAGE 1 — Preparación: Java, Maven, caché y settings.xml
# ─────────────────────────────────────────────────────────────
stages:
  - stage: Prepare
    displayName: "Preparación del entorno"
    jobs:
      - job: SetupAndValidate
        displayName: "Java · Maven · Caché · Dependencias"
        steps:

          - checkout: self
            fetchDepth: 0
            persistCredentials: true

          - bash: |
              set -euo pipefail
              echo "===== Java ====="
              java -version
              echo "===== Maven ====="
              mvn -version
            displayName: "Validar Java y Maven"

          - task: Cache@2
            condition: eq(variables['enableMavenCache'], 'true')
            displayName: "Cache Maven (.m2)"
            inputs:
              key: 'maven | "$(Agent.OS)" | "$(Build.SourceBranchName)"'
              restoreKeys: |
                maven | "$(Agent.OS)"
              path: "$(HOME)/.m2/repository"

          - bash: |
              set -euo pipefail
              mkdir -p "$(HOME)/.m2"
              if [ -f "$(mavenSettingsFile)" ]; then
                cp "$(mavenSettingsFile)" "$(HOME)/.m2/settings.xml"
                chmod 600 "$(HOME)/.m2/settings.xml"
                echo "settings.xml configurado en ~/.m2"
              else
                echo "No se encontró settings.xml; se usará configuración Maven por defecto."
              fi
            displayName: "Preparar configuración Maven"

          - bash: |
              set -euo pipefail
              if [ -f "$(HOME)/.m2/settings.xml" ]; then
                mvn -B -U -s "$(HOME)/.m2/settings.xml" \
                  -DskipTests \
                  dependency:tree
              else
                mvn -B -U \
                  -DskipTests \
                  dependency:tree
              fi
            displayName: "Validar dependencias Maven"

# ─────────────────────────────────────────────────────────────
# STAGE 2 — Checkmarx: detección de NUEVAS vulnerabilidades
# ─────────────────────────────────────────────────────────────
  - stage: ScanNew
    displayName: "Checkmarx — Vulnerabilidades NUEVAS"
    dependsOn: Prepare
    condition: succeeded()
    jobs:
      - job: CheckmarxScanNew
        displayName: "SAST + SCA · Estado: NEW"
        steps:

          - checkout: self
            fetchDepth: 0
            persistCredentials: true

          - task: Checkmarx AST@3
            displayName: "Checkmarx One — Nuevas (SAST + SCA)"
            inputs:
              CheckmarxService: "$(checkmarxServiceConnection)"
              projectName: "$(Build.Repository.Name)"
              branchName: "$(Build.SourceBranchName)"
              tenantName: "$(checkmarxTenant)"
              additionalParams: >-
                --scan-types sast,sca
                --threshold "sast-critical=$(thresholdCritical);sast-high=$(thresholdHigh);sast-medium=$(thresholdMedium)"
                --filter "state=NEW"
            continueOnError: false

          - bash: |
              echo "=============================================="
              echo " STAGE: Vulnerabilidades NUEVAS"
              echo " Proyecto : $(Build.Repository.Name)"
              echo " Branch   : $(Build.SourceBranchName)"
              echo " Umbrales — Críticas: $(thresholdCritical) | Altas: $(thresholdHigh) | Medias: $(thresholdMedium)"
              echo "=============================================="
            displayName: "Resumen — Nuevas"

# ─────────────────────────────────────────────────────────────
# STAGE 3 — Checkmarx: detección de RECURRENTES
# ─────────────────────────────────────────────────────────────
  - stage: ScanRecurrent
    displayName: "Checkmarx — Vulnerabilidades RECURRENTES"
    dependsOn: ScanNew
    condition: succeeded()
    jobs:
      - job: CheckmarxScanRecurrent
        displayName: "SAST + SCA · Estado: RECURRENT"
        steps:

          - checkout: self
            fetchDepth: 0
            persistCredentials: true

          - task: Checkmarx AST@3
            displayName: "Checkmarx One — Recurrentes (SAST + SCA)"
            inputs:
              CheckmarxService: "$(checkmarxServiceConnection)"
              projectName: "$(Build.Repository.Name)"
              branchName: "$(Build.SourceBranchName)"
              tenantName: "$(checkmarxTenant)"
              additionalParams: >-
                --scan-types sast,sca
                --threshold "sast-critical=$(thresholdCritical);sast-high=$(thresholdHigh);sast-medium=$(thresholdMedium)"
                --filter "state=RECURRENT"
            continueOnError: false

          - bash: |
              echo "=============================================="
              echo " STAGE: Vulnerabilidades RECURRENTES"
              echo " Proyecto : $(Build.Repository.Name)"
              echo " Branch   : $(Build.SourceBranchName)"
              echo " Umbrales — Críticas: $(thresholdCritical) | Altas: $(thresholdHigh) | Medias: $(thresholdMedium)"
              echo "=============================================="
            displayName: "Resumen — Recurrentes"

# ─────────────────────────────────────────────────────────────
# STAGE 4 — Build y pruebas MuleSoft
# ─────────────────────────────────────────────────────────────
  - stage: Build
    displayName: "MuleSoft — Build y pruebas"
    dependsOn: ScanRecurrent
    condition: succeeded()
    jobs:
      - job: MuleBuild
        displayName: "Maven build"
        steps:

          - checkout: self
            fetchDepth: 0
            persistCredentials: true

          - task: Cache@2
            condition: eq(variables['enableMavenCache'], 'true')
            displayName: "Cache Maven (.m2)"
            inputs:
              key: 'maven | "$(Agent.OS)" | "$(Build.SourceBranchName)"'
              restoreKeys: |
                maven | "$(Agent.OS)"
              path: "$(HOME)/.m2/repository"

          - bash: |
              set -euo pipefail
              mkdir -p "$(HOME)/.m2"
              if [ -f "$(mavenSettingsFile)" ]; then
                cp "$(mavenSettingsFile)" "$(HOME)/.m2/settings.xml"
                chmod 600 "$(HOME)/.m2/settings.xml"
              fi
            displayName: "Restaurar settings.xml"

          - bash: |
              set -euo pipefail
              if [ -f "$(HOME)/.m2/settings.xml" ]; then
                mvn -B -U -s "$(HOME)/.m2/settings.xml" $(mavenGoals)
              else
                mvn -B -U $(mavenGoals)
              fi
            displayName: "Maven — Build y pruebas"

          - bash: |
              echo "=============================================="
              echo " POC MuleSoft + Checkmarx completada"
              echo " Proyecto : $(Build.Repository.Name)"
              echo " Branch   : $(Build.SourceBranchName)"
              echo " Tenant   : $(checkmarxTenant)"
              echo " Scanners : SAST + SCA (NEW + RECURRENT)"
              echo "=============================================="
            displayName: "Resumen final de la POC"