trigger:
  branches:
    include:
      - main
      - dev
      - azure-boards

pool:
  vmImage: "ubuntu-latest"

variables:
  checkmarxServiceConnection: "juiceshop-connection"
  checkmarxTenant: "nfr_lugapel-ast"

  # Umbrales de calidad — compartidos por ambas fases
  thresholdCritical: "0"
  thresholdHigh: "5"
  thresholdMedium: "10"

# ─────────────────────────────────────────────────────────────
# STAGE 1 — Preparación: checkout y validación del entorno
# ─────────────────────────────────────────────────────────────
stages:
  - stage: Prepare
    displayName: "Preparación del entorno"
    jobs:
      - job: SetupAndValidate
        displayName: "Checkout + Validación"
        steps:

          - checkout: self
            fetchDepth: 0
            persistCredentials: true

          - bash: |
              set -euo pipefail
              echo "===== Repositorio ====="
              echo "Proyecto : $(Build.Repository.Name)"
              echo "Branch   : $(Build.SourceBranchName)"
              echo "Directorio: $(Build.SourcesDirectory)"
              echo ""
              echo "===== Contenido raíz ====="
              ls -la "$(Build.SourcesDirectory)"
            displayName: "Validar checkout y estructura del repositorio"

# ─────────────────────────────────────────────────────────────
# STAGE 2 — Checkmarx: detección de NUEVAS vulnerabilidades
# ─────────────────────────────────────────────────────────────
  - stage: ScanNew
    displayName: "Checkmarx — Vulnerabilidades NUEVAS"
    dependsOn: Prepare
    condition: succeeded()
    jobs:
      - job: CheckmarxScanNew
        displayName: "SAST + SCA · Estado: NEW"
        steps:

          - checkout: self
            fetchDepth: 0
            persistCredentials: true

          - task: Checkmarx AST@3
            displayName: "Checkmarx One — Nuevas (SAST + SCA)"
            inputs:
              CheckmarxService: "$(checkmarxServiceConnection)"
              projectName: "$(Build.Repository.Name)"
              branchName: "$(Build.SourceBranchName)"
              tenantName: "$(checkmarxTenant)"
              additionalParams: >-
                --scan-types sast,sca
                --threshold "sast-critical=$(thresholdCritical);sast-high=$(thresholdHigh);sast-medium=$(thresholdMedium)"
                --filter "state=NEW"
            continueOnError: false

          - bash: |
              echo "=============================================="
              echo " STAGE: Vulnerabilidades NUEVAS"
              echo " Proyecto : $(Build.Repository.Name)"
              echo " Branch   : $(Build.SourceBranchName)"
              echo " Umbrales — Críticas: $(thresholdCritical) | Altas: $(thresholdHigh) | Medias: $(thresholdMedium)"
              echo "=============================================="
            displayName: "Resumen — Nuevas"

# ─────────────────────────────────────────────────────────────
# STAGE 3 — Checkmarx: detección de RECURRENTES
# ─────────────────────────────────────────────────────────────
  - stage: ScanRecurrent
    displayName: "Checkmarx — Vulnerabilidades RECURRENTES"
    dependsOn: ScanNew
    condition: succeeded()
    jobs:
      - job: CheckmarxScanRecurrent
        displayName: "SAST + SCA · Estado: RECURRENT"
        steps:

          - checkout: self
            fetchDepth: 0
            persistCredentials: true

          - task: Checkmarx AST@3
            displayName: "Checkmarx One — Recurrentes (SAST + SCA)"
            inputs:
              CheckmarxService: "$(checkmarxServiceConnection)"
              projectName: "$(Build.Repository.Name)"
              branchName: "$(Build.SourceBranchName)"
              tenantName: "$(checkmarxTenant)"
              additionalParams: >-
                --scan-types sast,sca
                --threshold "sast-critical=$(thresholdCritical);sast-high=$(thresholdHigh);sast-medium=$(thresholdMedium)"
                --filter "state=RECURRENT"
            continueOnError: false

          - bash: |
              echo "=============================================="
              echo " STAGE: Vulnerabilidades RECURRENTES"
              echo " Proyecto : $(Build.Repository.Name)"
              echo " Branch   : $(Build.SourceBranchName)"
              echo " Umbrales — Críticas: $(thresholdCritical) | Altas: $(thresholdHigh) | Medias: $(thresholdMedium)"
              echo "=============================================="
            displayName: "Resumen — Recurrentes"

# ─────────────────────────────────────────────────────────────
# STAGE 4 — Resumen final de la POC
# ─────────────────────────────────────────────────────────────
  - stage: Summary
    displayName: "Resumen de la POC"
    dependsOn: ScanRecurrent
    condition: succeeded()
    jobs:
      - job: POCSummary
        displayName: "Resumen final"
        steps:
          - bash: |
              echo "=============================================="
              echo " POC Checkmarx One completada exitosamente"
              echo " Proyecto : $(Build.Repository.Name)"
              echo " Branch   : $(Build.SourceBranchName)"
              echo " Tenant   : $(checkmarxTenant)"
              echo " Scanners : SAST + SCA"
              echo " Fases    : NEW + RECURRENT"
              echo " Umbrales — Críticas: $(thresholdCritical) | Altas: $(thresholdHigh) | Medias: $(thresholdMedium)"
              echo "=============================================="
            displayName: "Resumen final de la POC"